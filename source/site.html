<title>Atelier BUT 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : le dossier Drive en colonne sombre à gauche, l'établi à droite (éditeur + console). */
:root {
  --paper: #eef2ed; --panel: #fbfcfa; --panel2: #f1f5f0; --ink: #13221b; --muted: #56685f; --line: #d4ddd5;
  --mask: #0e4231; --mask2: #0a3125; --silk: #eaf3ee; --silk-dim: #a2c4b4; --silk-line: rgba(234,243,238,.14);
  --copper: #b5652a; --copper-hi: #c9783b; --copper-ink: #fff8f1; --copper-soft: #f4e4d6;
  --ok: #1d7a4b; --warn: #9a6200; --bad: #bf3426;
  --term: #07130e; --term-ink: #d6e6dc; --term-dim: #6f8f80; --term-in: #f0a868; --term-err: #ff8a7a; --term-ok: #7fd6a4; --term-line: #16291f;
  --code-bg: #fdfefc; --gut-bg: #f2f5f1; --gutter: #8b9c93; --sel: rgba(181,101,42,.24); --curline: rgba(14,66,49,.045);
  --s-kw: #0d6a49; --s-ty: #1b5c88; --s-str: #964714; --s-com: #7b8d84; --s-num: #7438b2; --s-pp: #a12f69; --s-std: #0f5c63;
  --f-disp: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --shadow: 0 1px 0 rgba(19,34,27,.04), 0 6px 20px -12px rgba(19,34,27,.25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0a1611; --panel: #0f1f18; --panel2: #13271f; --ink: #e2ece6; --muted: #92aa9e; --line: #213b2f;
  --mask: #0c3a2a; --mask2: #072519; --silk: #e6f2eb; --silk-dim: #8fb7a5; --silk-line: rgba(230,242,235,.12);
  --copper: #e0924f; --copper-hi: #eba366; --copper-ink: #1c0f04; --copper-soft: #3a2615;
  --ok: #5fd394; --warn: #e6b450; --bad: #ff7b6b;
  --code-bg: #0c1a14; --gut-bg: #0d1c15; --gutter: #50705f; --sel: rgba(224,146,83,.3); --curline: rgba(255,255,255,.035);
  --s-kw: #62d6a2; --s-ty: #7cc0f0; --s-str: #f0a868; --s-com: #5f7f71; --s-num: #c39cf5; --s-pp: #f08cc0; --s-std: #6fd8d0;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0a1611; --panel: #0f1f18; --panel2: #13271f; --ink: #e2ece6; --muted: #92aa9e; --line: #213b2f;
  --mask: #0c3a2a; --mask2: #072519; --silk: #e6f2eb; --silk-dim: #8fb7a5; --silk-line: rgba(230,242,235,.12);
  --copper: #e0924f; --copper-hi: #eba366; --copper-ink: #1c0f04; --copper-soft: #3a2615;
  --ok: #5fd394; --warn: #e6b450; --bad: #ff7b6b;
  --code-bg: #0c1a14; --gut-bg: #0d1c15; --gutter: #50705f; --sel: rgba(224,146,83,.3); --curline: rgba(255,255,255,.035);
  --s-kw: #62d6a2; --s-ty: #7cc0f0; --s-str: #f0a868; --s-com: #5f7f71; --s-num: #c39cf5; --s-pp: #f08cc0; --s-std: #6fd8d0;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }

/* ---------- la carte (sidebar) ---------- */
.board {
  background-color: var(--mask);
  color: var(--silk); display: flex; flex-direction: column; min-height: 0; position: relative;
  border-right: 1px solid var(--mask2);
}
.brand { padding: 20px 18px 14px; display: grid; gap: 2px; }
.brand .ref { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--silk-dim); text-transform: uppercase; }
.brand h1 { margin: 0; font-family: var(--f-disp); font-weight: 700; font-size: 26px; letter-spacing: .02em; line-height: 1.1; text-wrap: balance; }
.brand h1 span { color: var(--copper-hi); }
.sync { margin: 2px 14px 10px; padding: 6px 6px 6px 10px; border: 1px solid var(--silk-line); border-radius: 6px; background: rgba(0,0,0,.18); display: grid; gap: 4px; }
.sync-btn { margin-left: auto; padding: 4px 7px; }
.sync-msg:empty { display: none; }
.sync-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--silk-dim); flex: none; box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
.led.on { background: #6ee7a8; box-shadow: 0 0 0 2px rgba(0,0,0,.25), 0 0 8px #6ee7a8; }
.led.busy { background: #f0b45c; animation: blink 1s infinite; }
.led.off { background: #f08a7a; }
@keyframes blink { 50% { opacity: .35; } }
.sync-msg { color: var(--silk-dim); font-size: 12px; line-height: 1.4; }
.sync-msg b { color: var(--silk); font-weight: 600; }
.btn-silk { background: transparent; border: 1px solid var(--silk-line); color: var(--silk); border-radius: 5px; padding: 5px 10px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.btn-silk:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.3); }
.btn-silk[disabled] { opacity: .55; cursor: default; }
.search { margin: 0 14px 10px; position: relative; }
.search input { width: 100%; background: rgba(0,0,0,.22); border: 1px solid var(--silk-line); border-radius: 6px; padding: 7px 10px 7px 30px; color: var(--silk); font-size: 13.5px; }
.search input::placeholder { color: var(--silk-dim); opacity: .8; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .7; }
.tree-scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 0 8px 16px; }
.sec-label { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--silk-dim); padding: 12px 10px 6px; display: flex; align-items: center; justify-content: space-between; }
.sec-label button { background: none; border: 1px solid var(--silk-line); color: var(--silk); border-radius: 4px; font-size: 12px; padding: 1px 7px; font-family: var(--f-body); letter-spacing: 0; text-transform: none; }
.sec-label button:hover { border-color: rgba(255,255,255,.35); }
.tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul ul { margin-left: 13px; border-left: 1px solid var(--silk-line); padding-left: 4px; }
.node { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--silk); padding: 4px 8px; border-radius: 5px; font-size: 13.5px; min-height: 30px; }
.node:hover { background: rgba(255,255,255,.07); }
.node.active { background: rgba(0,0,0,.28); box-shadow: inset 2px 0 0 var(--copper-hi); }
.node .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .chev { width: 26px; height: 26px; margin: -6px -7px -6px -7px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; transition: transform .15s, background .15s; opacity: .8; cursor: pointer; }
.node .chev:hover { background: rgba(255,255,255,.12); opacity: 1; }
.node .chev svg { display: block; }
.node.open .chev { transform: rotate(90deg); }
.pad { flex: none; width: 10px; height: 13px; border-radius: 2px 4px 2px 2px; background: var(--copper-hi); position: relative; }
.pad::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 1.5px; background: var(--mask); box-shadow: 0 3px 0 var(--mask); }
.pad.doc { background: var(--silk-dim); }
.pad.folder { width: 14px; height: 10px; border-radius: 2px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--silk-dim); }
.pad.folder::after { display: none; }
.dot-mod { width: 6px; height: 6px; border-radius: 50%; background: var(--copper-hi); flex: none; }
.cnt { font-family: var(--f-mono); font-size: 11px; color: var(--silk-dim); }
.board-foot { padding: 10px 16px 14px; border-top: 1px solid var(--silk-line); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--silk-dim); font-family: var(--f-mono); letter-spacing: .04em; }
.empty-note { color: var(--silk-dim); font-size: 12.5px; padding: 4px 10px; }

/* ---------- zone principale ---------- */
main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 52px; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 6px; width: 36px; height: 34px; align-items: center; justify-content: center; }
.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13.5px; min-width: 0; flex: 1; }
.crumbs a, .crumbs span { color: var(--muted); text-decoration: none; padding: 2px 4px; border-radius: 4px; }
.crumbs a:hover { color: var(--ink); background: var(--panel2); }
.crumbs .sep { color: var(--line); padding: 0; }
.crumbs .cur { color: var(--ink); font-weight: 600; }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 6px; height: 32px; min-width: 32px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }

.view { flex: 1; min-height: 0; overflow: auto; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 28px; padding-block: 28px 48px; }

/* page dossier */
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--copper); }
.f-title { font-family: var(--f-disp); font-weight: 700; font-size: clamp(30px, 4.2vw, 44px); line-height: 1.05; margin: 6px 0 8px; text-wrap: balance; letter-spacing: .01em; }
.f-meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.f-meta a { color: var(--muted); }
.f-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.group { margin-bottom: 30px; }
.group h2 { font-family: var(--f-disp); font-size: 18px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; letter-spacing: .02em; }
.group h2 small { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-weight: 400; letter-spacing: .06em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; text-align: left; padding: 14px 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s; min-width: 0; }
.card:hover { border-color: var(--copper); box-shadow: var(--shadow); transform: translateY(-1px); }
.card .des { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; color: var(--copper); display: flex; align-items: center; gap: 8px; }
.card .des .dot-mod { margin-left: auto; }
.card h3 { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .fn { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 6px; border-top: 1px dashed var(--line); margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 6px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--ink); text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--copper); border-color: var(--copper); color: var(--copper-ink); font-weight: 600; }
.btn.primary:hover { background: var(--copper-hi); border-color: var(--copper-hi); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn kbd { font-family: var(--f-mono); font-size: 10.5px; opacity: .8; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; }
.notice { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 16px 18px; color: var(--muted); }

/* ---------- fichier : établi ---------- */
.file-view { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.fhead { padding: 14px 20px 12px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: var(--panel); }
.fhead-txt { min-width: 0; flex: 1 1 320px; }
.fhead h2 { margin: 2px 0 2px; font-family: var(--f-disp); font-size: 24px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.fhead h2 input { font: inherit; border: 1px dashed var(--line); background: var(--panel2); border-radius: 4px; padding: 0 6px; width: min(100%, 420px); }
.fhead p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 75ch; }
.fhead .note { margin-top: 6px; font-size: 12.5px; color: var(--warn); }
.fhead .note button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.workbench { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); min-height: 38px; background: var(--panel2); }
.pane-bar .lbl { font-family: var(--f-mono); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
.pane-bar .sp { flex: 1; }

/* éditeur */
.ed { flex: 1; min-height: 0; overflow: auto; background: var(--code-bg); position: relative; }
.ed-inner { display: grid; grid-template-columns: auto 1fr; min-width: 100%; width: max-content; min-height: 100%; }
.gutter { background: var(--gut-bg); color: var(--gutter); text-align: right; padding: 12px 10px 40px 12px; font-family: var(--f-mono); font-size: 13.5px; line-height: 21px; user-select: none; border-right: 1px solid var(--line); position: sticky; left: 0; z-index: 2; min-width: 46px; }
.gutter div { position: relative; padding-left: 12px; }
.gutter .e { color: var(--bad); font-weight: 600; }
.gutter .e::before, .gutter .w::before { content: ""; position: absolute; left: 0; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.gutter .w { color: var(--warn); }
.gutter .w::before { background: var(--warn); }
.gutter .r { color: var(--bad); }
.codecell { position: relative; }
.codecell pre, .codecell textarea { margin: 0; padding: 12px 40px 40px 14px; font-family: var(--f-mono); font-size: 13.5px; line-height: 21px; tab-size: 4; -moz-tab-size: 4; white-space: pre; border: 0; letter-spacing: 0; font-variant-ligatures: none; }
.codecell pre { color: var(--ink); pointer-events: none; min-height: 100%; }
.codecell textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--ink); outline: none; overflow: hidden; }
.codecell textarea::selection { background: var(--sel); color: transparent; }
.hl-line { position: absolute; left: 0; right: 0; height: 21px; pointer-events: none; }
.hl-line.err { background: color-mix(in srgb, var(--bad) 13%, transparent); }
.hl-line.cur { background: var(--curline); }
.tk-kw { color: var(--s-kw); font-weight: 600; }
.tk-ty { color: var(--s-ty); }
.tk-str { color: var(--s-str); }
.tk-com { color: var(--s-com); font-style: italic; }
.tk-num { color: var(--s-num); }
.tk-pp { color: var(--s-pp); }
.tk-std { color: var(--s-std); }

/* console */
.console { border-left: 1px solid var(--line); }
.run-state { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.run-state .led { box-shadow: none; }
.run-state .led.idle { background: var(--line); }
.run-state .led.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: blink 1.2s infinite; }
.run-state .led.wait { background: var(--copper); box-shadow: 0 0 6px var(--copper); animation: blink 1s infinite; }
.run-state .led.err { background: var(--bad); }
.run-state .led.done { background: var(--ok); }
.term { flex: 1; min-height: 0; overflow: auto; background: var(--term); color: var(--term-ink); font-family: var(--f-mono); font-size: 13.5px; line-height: 1.55; padding: 14px 16px 24px; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.term .u { color: var(--term-in); }
.term .x { color: var(--term-err); }
.term .sys { color: var(--term-dim); display: block; margin: 6px 0; font-size: 12px; }
.term .sys.bad { color: var(--term-err); }
.term .sys.good { color: var(--term-ok); }
.term .hint { color: var(--term-dim); white-space: normal; font-family: var(--f-body); font-size: 13.5px; line-height: 1.6; }
.term .hint kbd { font-family: var(--f-mono); font-size: 11.5px; border: 1px solid var(--term-line); border-radius: 3px; padding: 0 5px; color: var(--term-ink); background: #0d1f17; }
.tin { background: transparent; border: 0; outline: none; color: var(--term-in); font-family: var(--f-mono); font-size: 13.5px; padding: 0; min-width: 2ch; width: 14ch; field-sizing: content; caret-color: var(--term-in); }
.tin::placeholder { color: #4b6a5b; }
.diag { border-top: 1px solid var(--line); background: var(--panel); max-height: 34%; overflow: auto; font-size: 13px; }
.diag:empty { display: none; }
.diag button { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 14px; color: var(--ink); align-items: baseline; }
.diag button:hover { background: var(--panel2); }
.diag .ln { font-family: var(--f-mono); font-size: 11.5px; flex: none; min-width: 52px; }
.diag .e .ln { color: var(--bad); }
.diag .w .ln { color: var(--warn); }
.diag .msg { min-width: 0; }

/* aide */
.help { position: absolute; right: 12px; top: 44px; z-index: 20; width: min(420px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px 18px; font-size: 13.5px; color: var(--ink); }
.help h4 { margin: 0 0 6px; font-family: var(--f-disp); font-size: 16px; }
.help h5 { margin: 12px 0 4px; font-size: 12px; font-family: var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--copper); }
.help ul { margin: 0; padding-left: 18px; }
.help li { margin: 2px 0; }
.help code { font-family: var(--f-mono); font-size: 12.5px; background: var(--panel2); padding: 0 4px; border-radius: 3px; }

/* aperçu doc */
.docprev { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; max-width: 80ch; overflow-wrap: anywhere; }

/* onglets console / tuteur */
.tabs { display: flex; gap: 2px; align-self: stretch; margin: -6px 0 -6px -6px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--copper); }
.tab .ping { width: 7px; height: 7px; border-radius: 50%; background: var(--copper); }
.con-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.term-help { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 2px; background: transparent; border: 1px solid #3d5c4c; color: var(--term-in); border-radius: 6px; padding: 6px 12px; font-family: var(--f-body); font-size: 13px; white-space: normal; }
.term-help:hover { border-color: var(--term-in); background: rgba(240,168,104,.08); }
.diag .row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.diag .row > button:first-child { border-bottom: 0; flex: 1; min-width: 0; }
.diag .row .xpl { width: auto; flex: none; border: 0; border-left: 1px solid var(--line); padding: 0 12px; color: var(--copper); font-size: 12.5px; font-weight: 500; }
.diag .row .xpl:hover { background: var(--copper-soft); }

.tutor { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
.thread { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.msg-u { align-self: flex-end; max-width: 85%; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px 10px 2px 10px; padding: 7px 12px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-a { align-self: stretch; font-size: 14px; line-height: 1.6; min-width: 0; }
.msg-a .who { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--copper); margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
.msg-a .body > :first-child { margin-top: 0; }
.msg-a .body > :last-child { margin-bottom: 0; }
.msg-a p { margin: 0 0 8px; }
.msg-a ul, .msg-a ol { margin: 0 0 8px; padding-left: 20px; }
.msg-a li { margin: 2px 0; }
.msg-a code { font-family: var(--f-mono); font-size: 12.5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.msg-a pre { margin: 6px 0 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.55; }
.msg-a pre code { background: none; border: 0; padding: 0; }
.msg-a h4 { margin: 8px 0 4px; font-size: 14px; }
.lnref { background: var(--copper-soft); border: 0; color: var(--copper); border-radius: 4px; padding: 0 5px; font: inherit; font-weight: 600; }
.lnref:hover { text-decoration: underline; }
.msg-a .err { color: var(--bad); font-size: 13px; }
.thinking { color: var(--muted); font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--copper); display: inline-block; animation: blink 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
.tutor-intro { color: var(--muted); font-size: 13.5px; line-height: 1.6; border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; }
.tutor-intro b { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 0; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--ink); }
.chip:hover { border-color: var(--copper); color: var(--copper); }
.chip.strong { border-color: var(--copper); color: var(--copper); font-weight: 600; }
.chip.ghost { color: var(--muted); border-style: dashed; }
.chip[disabled] { opacity: .5; cursor: default; }
.ask { display: flex; gap: 8px; padding: 10px 14px 12px; align-items: flex-end; }
.ask textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--code-bg); border-radius: 8px; padding: 8px 10px; font-size: 14px; line-height: 1.45; max-height: 130px; }
.ask textarea:focus { border-color: var(--copper); outline: none; }
.hint-meter { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 6px 14px 0; display: flex; gap: 4px; align-items: center; }
.hint-meter span { width: 16px; height: 4px; border-radius: 2px; background: var(--line); }
.hint-meter span.on { background: var(--copper); }


/* débogueur */
.bp-hint { font-size: 12px; color: var(--muted); opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dbgbar { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.dctl { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; font-size: 12.5px; color: var(--ink); }
.dctl:hover:not([disabled]) { border-color: var(--copper); color: var(--copper); }
.dctl[disabled] { opacity: .45; cursor: default; }
.dctl[data-cmd="stop"] { color: var(--bad); }
.pane.debugging .pane-bar { background: var(--copper-soft); }
.gutter div[data-l] { cursor: pointer; }
.gutter div[data-l]:hover { color: var(--ink); }
.gutter .bp::before { content: ""; position: absolute; left: 0; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--gut-bg); }
.gutter .cur { color: var(--copper); font-weight: 700; }
.gutter .cur::after { content: "▶"; position: absolute; left: -1px; top: 0; font-size: 9px; color: var(--copper); }
.hl-line.dbg { background: color-mix(in srgb, var(--copper) 18%, transparent); box-shadow: inset 3px 0 0 var(--copper); }
.vars { border-bottom: 1px solid var(--line); background: var(--panel); max-height: 48%; overflow: auto; font-size: 13px; flex: none; }
.frame { border-bottom: 1px solid var(--line); }
.frame summary { cursor: pointer; padding: 7px 14px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; color: var(--muted); list-style-position: inside; }
.frame[open] summary { color: var(--ink); }
.var { display: grid; grid-template-columns: minmax(70px, auto) auto minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 5px 14px 5px 26px; border-top: 1px dashed var(--line); }
.vn { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.vt { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.vv { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; border-radius: 3px; padding: 0 3px; }
.vv.dim { color: var(--muted); }
.chg { background: var(--copper-soft); color: var(--copper); animation: flash .7s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--copper) 45%, transparent); } to { box-shadow: 0 0 0 0 transparent; } }
.cells { display: flex; flex-wrap: wrap; gap: 3px; min-width: 0; }
.cells.grid { flex-direction: column; flex-wrap: nowrap; }
.row-cells { display: flex; gap: 6px; align-items: center; }
.row-cells .ri { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); min-width: 26px; }
.cell { display: grid; text-align: center; min-width: 30px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--code-bg); }
.cell .ci { font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); background: var(--panel2); border-bottom: 1px solid var(--line); padding: 0 4px; }
.cell .cv { font-family: var(--f-mono); font-size: 12.5px; padding: 1px 5px; }
.cell.chg { border-color: var(--copper); }
.cell.chg .cv { color: var(--copper); font-weight: 600; }
.cell.more { place-items: center; font-size: 11px; color: var(--muted); padding: 0 6px; }
.obj { display: grid; gap: 2px; }
.of { display: flex; gap: 8px; align-items: baseline; }
.of .on { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.novar { padding: 4px 26px 8px; color: var(--muted); font-size: 12.5px; }

/* tests */
.tab .tcount { font-size: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 0 5px; letter-spacing: 0; }
.tab .tcount:empty { display: none; }
.tests { flex: 1; min-height: 0; overflow: auto; background: var(--panel); display: flex; flex-direction: column; }
.tests-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.tests-head .sp { flex: 1; }
.tsum { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tsum.good { color: var(--ok); font-weight: 600; }
.tsum.bad { color: var(--bad); font-weight: 600; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.tnote { font-size: 13px; color: var(--muted); padding: 0 14px; }
.tnote:not(:empty) { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tnote.bad { color: var(--bad); }
.tform { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.tform label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
.tform input, .tform textarea { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--code-bg); font-size: 13.5px; font-family: var(--f-mono); resize: vertical; }
.tform input { font-family: var(--f-body); }
.tests-list { padding: 8px 14px 16px; display: grid; gap: 8px; }
.tempty { color: var(--muted); font-size: 13.5px; padding: 8px 0; }
.titem { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); overflow: hidden; }
.titem.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.titem.ko { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.thead { display: flex; align-items: center; gap: 8px; padding: 7px 10px; }
.ticon { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel2); color: var(--muted); flex: none; }
.titem.ok .ticon { background: var(--ok); color: var(--panel); }
.titem.ko .ticon { background: var(--bad); color: var(--panel); }
.titem.run .ticon { animation: blink 1s infinite; }
.tlabel { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0; }
.tsrc { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.tdel { background: none; border: 0; color: var(--muted); font-size: 17px; line-height: 1; padding: 0 4px; }
.tdel:hover { color: var(--bad); }
.tbody { padding: 0 10px 9px 38px; display: grid; gap: 4px; font-size: 13px; }
.tkv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.tk { color: var(--muted); font-size: 12px; }
.tbody code, .tbody pre { font-family: var(--f-mono); font-size: 12.5px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.twhy { color: var(--bad); }
.tout summary { cursor: pointer; color: var(--copper); font-size: 12.5px; }
.tout pre { background: var(--term); color: var(--term-ink); padding: 8px 10px; border-radius: 5px; margin-top: 6px; max-height: 260px; overflow: auto; }

/* énoncé d'entraînement */
.fhead p.stmt { white-space: pre-line; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin-top: 6px; max-height: 9.5em; overflow: auto; }
.pad.train { background: transparent; box-shadow: inset 0 0 0 1.5px var(--copper-hi); }
.pad.train::after { background: var(--copper-hi); box-shadow: 0 3px 0 var(--copper-hi); }

/* panneau entraînement */
.train { border: 1px solid var(--copper); background: var(--panel); border-radius: 10px; padding: 18px 20px; margin: -6px 0 28px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.train h2 { margin: 0; font-family: var(--f-disp); font-size: 20px; }
.train .muted { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.fld { display: grid; gap: 5px; font-size: 13px; color: var(--muted); max-width: 520px; }
.fld input { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--code-bg); font-size: 14px; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; width: max-content; max-width: 100%; }
.seg button { border: 0; background: var(--panel); padding: 6px 14px; font-size: 13.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--copper); color: var(--copper-ink); font-weight: 600; }

/* quiz */
.quiz { display: grid; gap: 14px; max-width: 760px; }
.qcard, .qrev, .qscore { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.qprog { display: flex; align-items: center; gap: 12px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.qprog .bar { flex: 1; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
.qprog .bar i { display: block; height: 100%; background: var(--copper); }
.qq { font-size: 16.5px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; text-wrap: pretty; }
.qcode { background: var(--code-bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 14px; font-family: var(--f-mono); font-size: 13px; line-height: 1.55; overflow-x: auto; margin: 0 0 10px; }
.qin { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.qin code { font-family: var(--f-mono); color: var(--ink); background: var(--panel2); padding: 1px 6px; border-radius: 4px; }
.choices { display: grid; gap: 8px; }
.choices.out { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.choice { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 14px; font-size: 14.5px; color: var(--ink); min-width: 0; }
.choice pre { margin: 0; font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.choice:hover:not([disabled]) { border-color: var(--copper); }
.choice[disabled] { cursor: default; }
.choice.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
.qfb { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 14.5px; background: var(--panel2); }
.qfb.ok b { color: var(--ok); } .qfb.ko b { color: var(--bad); }
.qscore { display: grid; gap: 8px; }
.qscore .big { font-family: var(--f-disp); font-size: 44px; font-weight: 700; line-height: 1; }
.qrev .qn { font-family: var(--f-mono); font-size: 12px; margin-bottom: 6px; }
.qrev.ok .qn { color: var(--ok); } .qrev.ko .qn { color: var(--bad); }
.qrev .qq { font-size: 15px; }
.qa { font-size: 14px; margin: 4px 0; }
.qa pre { margin: 4px 0 0; font-family: var(--f-mono); font-size: 12.5px; background: var(--panel2); padding: 6px 10px; border-radius: 5px; white-space: pre-wrap; }
.qx { color: var(--muted); font-size: 14px; margin: 8px 0 0; }


/* guide */
.guide-link { margin: 4px 0 2px; }
.guide-link svg { flex: none; opacity: .85; }
.guide { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; align-items: start; }
.gtoc { position: sticky; top: 8px; display: grid; gap: 1px; font-size: 13.5px; }
.gtoc-t { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.gtoc a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-left: 2px solid var(--line); }
.gtoc a:hover { color: var(--ink); border-left-color: var(--copper); }
.gbody { display: grid; gap: 14px; min-width: 0; }
.gsec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px 16px; scroll-margin-top: 12px; }
.gsec h2 { font-family: var(--f-disp); font-size: 21px; margin: 2px 0 10px; letter-spacing: .01em; }
.gtext { font-size: 14.5px; line-height: 1.6; max-width: 72ch; }
.gtext ul, .gtext ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.gtext code { font-family: var(--f-mono); font-size: 12.5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.gtext h4 { margin: 0 0 6px; font-size: 13px; font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--copper); }
.k { font-family: var(--f-mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel2); color: var(--ink); white-space: nowrap; }
.steps { counter-reset: st; list-style: none; padding-left: 0 !important; gap: 10px !important; }
.steps li { counter-increment: st; position: relative; padding-left: 36px; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--copper); color: var(--copper-ink); font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; display: grid; place-items: center; }
.gtry { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.gtry:empty { display: none; }
.gkeys { margin-top: 10px; border-collapse: collapse; font-size: 14px; }
.gkeys td { padding: 5px 14px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
.gkeys td:first-child { white-space: nowrap; }
.gcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
@media (max-width: 1000px) { .guide { grid-template-columns: minmax(0, 1fr); gap: 16px; } .gtoc { position: static; display: flex; flex-wrap: wrap; gap: 6px; } .gtoc-t { width: 100%; } .gtoc a { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; } }

.qtp { font-family: var(--f-mono); font-size: 11px; color: var(--copper); border: 1px solid var(--copper); border-radius: 999px; padding: 0 8px; }
/* préparation des exercices */
.prep-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border: 1px solid var(--copper); background: var(--copper-soft); border-radius: 10px; padding: 14px 18px; margin: -6px 0 20px; }
.prep-banner .muted { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.prep { border: 1px solid var(--copper); background: var(--panel); border-radius: 10px; padding: 18px 20px; margin: -6px 0 26px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.prep-head { display: flex; align-items: center; justify-content: space-between; }
.prep h2 { margin: 0; font-family: var(--f-disp); font-size: 20px; }
.prep .muted { color: var(--muted); font-size: 13.5px; margin: 0; max-width: 72ch; }
.prep .small { font-size: 12.5px; }
.prep-tps { display: grid; gap: 6px; }
.prep-tp { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.prep-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.prep-bh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 4px; }
.prep-bh .sp { flex: 1; }
.prep select, .fld select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--code-bg); font-size: 13.5px; color: var(--ink); }
.prep-rule { font-size: 12.5px; color: var(--muted); font-style: italic; }
.prep-file { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 4px 2px; font-size: 13.5px; cursor: pointer; }
.prep-file code { font-family: var(--f-mono); font-size: 12.5px; color: var(--copper); }
.prep-file.exists { opacity: .6; cursor: default; }
.prep-done { color: var(--ok); font-weight: 600; margin: 0; }
.todo-tag { margin-left: auto; font-size: 10.5px; letter-spacing: .06em; color: var(--copper-ink); background: var(--copper); border-radius: 999px; padding: 1px 8px; }
.sync-link { color: #f6c08f; font-weight: 600; }
@media (max-width: 600px) { .prep-file { grid-template-columns: auto minmax(0, 1fr); } .prep-file span { grid-column: 2; } }

/* lecteur de documents */
.wrap.wide { max-width: 1180px; }
.pdfv { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel2); }
.pdfv.compact { border: 0; border-radius: 0; flex: 1; min-height: 0; }
.pdf-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
.pdf-bar .sp { flex: 1; }
.pdf-info { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.pdf-pages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px; overflow-x: auto; }
.pdfv.compact .pdf-pages { flex: 1; min-height: 0; overflow: auto; align-items: safe center; }
.pdf-page { position: relative; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 8px 24px -12px rgba(0,0,0,.35); flex: none; max-width: none; }
.pdf-page canvas { display: block; width: 100%; height: 100%; }
.pdf-num { position: absolute; right: 8px; bottom: -20px; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.pdf-text { border: 0; border-radius: 0; max-width: none; margin: 0; }
.pdfv.compact .pdf-text { flex: 1; min-height: 0; overflow: auto; }
.docimg { max-width: 100%; height: auto; background: #fff; border-radius: 4px; box-shadow: var(--shadow); }
.sujet { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel2); }
.sujet-pane { border-left: 1px solid var(--line); }
.sujet-pane .pane-bar select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; background: var(--code-bg); color: var(--ink); max-width: 60%; font-size: 12.5px; }
.sujet-name { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ================= coloration syntaxique ================= */
const KW = new Set('if else for while do switch case default break continue return const static struct class public private using namespace typedef sizeof new delete true false nullptr auto inline void enum constexpr template try catch throw goto'.split(' '));
const TY = new Set('int float double char bool long short unsigned signed string vector size_t'.split(' '));
const STDW = new Set('cout cin cerr endl std fixed scientific setprecision setw setfill left right getline printf scanf puts getchar putchar sqrt pow abs fabs rand srand time main swap sort max min to_string boolalpha'.split(' '));
const escH = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function highlight(src) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|(?![\s\S])))|("(?:\\.|[^"\\\n])*"?)|('(?:\\.|[^'\\\n])*'?)|(^[ \t]*#[^\n]*)|(\b\d[\d.']*(?:[eE][+-]?\d+)?[a-zA-Z]*|\.\d+(?:[eE][+-]?\d+)?f?)|([A-Za-z_]\w*)/gm;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += escH(src.slice(last, m.index)); last = re.lastIndex;
    const t = escH(m[0]);
    if (m[1]) out += '<span class="tk-com">' + t + '</span>';
    else if (m[2] || m[3]) out += '<span class="tk-str">' + t + '</span>';
    else if (m[4]) out += '<span class="tk-pp">' + t.replace(/(&lt;[^&]*&gt;|"[^"]*")/, '<span class="tk-str">$1</span>') + '</span>';
    else if (m[5]) out += '<span class="tk-num">' + t + '</span>';
    else if (m[6]) out += KW.has(m[0]) ? '<span class="tk-kw">' + t + '</span>' : TY.has(m[0]) ? '<span class="tk-ty">' + t + '</span>' : STDW.has(m[0]) ? '<span class="tk-std">' + t + '</span>' : t;
  }
  return out + escH(src.slice(last));
}

function wbResizable(wb, edPane, sujetPane, conPane) {
  const tip = 'Glisse pour agrandir ou réduire · double-clic : taille par défaut';
  const hA = el('div', { class: 'wx-split v r', title: tip, role: 'separator' });
  const hB = el('div', { class: 'wx-split v r', title: tip, role: 'separator' });
  const hC = el('div', { class: 'wx-split h', title: tip, role: 'separator' });
  edPane.style.position = 'relative'; sujetPane.style.position = sujetPane.style.position || 'relative';
  edPane.append(hA); sujetPane.append(hB); conPane.append(hC);
  const DEF = { cols2: [0.556], cols3: [0.38, 0.34], mix: [0.5, 0.57], rows2: [0.565] };
  let sz = Object.assign({}, DEF, store.get('wb:sizes', {}) || {});
  const mode = () => {
    if (matchMedia('(max-width: 820px)').matches) return 'none';
    const w = innerWidth, suj = wb.classList.contains('with-sujet');
    return suj ? (w > 1360 ? 'cols3' : 'mix') : (w > 1100 ? 'cols2' : 'rows2');
  };
  const fr = x => 'minmax(0, ' + x.toFixed(4) + 'fr)';
  function apply() {
    const m = mode(), v = sz[m];
    hA.hidden = !(m === 'cols2' || m === 'cols3' || m === 'mix'); hB.hidden = m !== 'cols3'; hC.hidden = !(m === 'mix' || m === 'rows2');
    wb.style.gridTemplateColumns = m === 'cols2' ? fr(v[0]) + ' ' + fr(1 - v[0]) : m === 'cols3' ? fr(v[0]) + ' ' + fr(v[1]) + ' ' + fr(Math.max(0.1, 1 - v[0] - v[1])) : m === 'mix' ? fr(v[0]) + ' ' + fr(1 - v[0]) : '';
    wb.style.gridTemplateRows = m === 'mix' || m === 'rows2' ? 'minmax(120px, ' + (m === 'mix' ? v[1] : v[0]).toFixed(4) + 'fr) minmax(90px, ' + (1 - (m === 'mix' ? v[1] : v[0])).toFixed(4) + 'fr)' : '';
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function drag(h, fn) {
    h.addEventListener('pointerdown', e => {
      if (mode() === 'none') return;
      e.preventDefault(); h.setPointerCapture(e.pointerId); wb.classList.add('dragging'); h.classList.add('on');
      const mv = ev => { const r = wb.getBoundingClientRect(); const m = mode(); sz[m] = sz[m].slice(); fn(m, (ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height); apply(); };
      const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); wb.classList.remove('dragging'); h.classList.remove('on'); store.set('wb:sizes', sz); };
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
  }
  drag(hA, (m, x) => {
    if (m === 'cols3') { const f3 = 1 - sz.cols3[0] - sz.cols3[1]; const f1 = clamp(x, 0.15, 1 - f3 - 0.12); sz.cols3 = [f1, 1 - f1 - f3]; }
    else sz[m][0] = clamp(x, 0.15, 0.85);
  });
  drag(hB, (m, x) => { if (m !== 'cols3') return; const f1 = sz.cols3[0]; const b2 = clamp(x, f1 + 0.12, 0.9); sz.cols3 = [f1, b2 - f1]; });
  drag(hC, (m, x, y) => { const t = clamp(y, 0.15, 0.88); if (m === 'mix') sz.mix[1] = t; else if (m === 'rows2') sz.rows2[0] = t; });
  hA.addEventListener('dblclick', () => { const m = mode(); if (m === 'cols3') sz.cols3 = DEF.cols3.slice(); else if (sz[m]) sz[m] = [DEF[m][0]].concat(sz[m].slice(1)); apply(); store.set('wb:sizes', sz); });
  hB.addEventListener('dblclick', () => { sz.cols3 = DEF.cols3.slice(); apply(); store.set('wb:sizes', sz); });
  hC.addEventListener('dblclick', () => { const m = mode(); if (m === 'mix') sz.mix = [sz.mix[0], DEF.mix[1]]; else if (m === 'rows2') sz.rows2 = DEF.rows2.slice(); apply(); store.set('wb:sizes', sz); });
  new MutationObserver(apply).observe(wb, { attributes: true, attributeFilter: ['class'] });
  const onR = () => { if (!wb.isConnected) { removeEventListener('resize', onR); return; } apply(); };
  addEventListener('resize', onR);
  apply();
}

function needsPrep(tp) { return !isSaeCtx(tp) && !isWebCtx(tp) && !inRef(tp) && !isTdFolder(tp) && !isSqlCtx(tp) && !tp.kids.some(isFolder) && !splitPlan(tp) && tp.kids.some(isSujet) && !tp.kids.some(k => !isFolder(k) && isCode(k)) && !store.get('prep-done:' + tp.id, false); }

const STOPW = new Set('de du des la le les et d l en avec a au aux un une pour par sur dans'.split(' '));
function slugWords(t, max) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim()
    .split(' ').filter(w => w && !STOPW.has(w)).slice(0, max || 3).join('_') || 'exercice';
}
function commentLines(text) {
  const out = [];
  for (const raw of String(text || '').replace(/\*\//g, '* /').split('\n')) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { out.push(' *'); continue; }
    const ind = /^\s*/.exec(line)[0];
    let cur = '';
    for (const w of line.trim().split(/\s+/)) {
      if (cur && (ind + cur + ' ' + w).length > 76) { out.push(' * ' + ind + cur); cur = w; }
      else cur = cur ? cur + ' ' + w : w;
    }
    if (cur) out.push(' * ' + ind + cur);

}
function starterBody(lang) {
  return lang === 'cpp'
    ? '#include <iostream>\nusing namespace std;\n\nint main()\n{\n    // Ton code ici\n\n    return 0;\n}\n'
    : '#include <stdio.h>\n\nint main(void)\n{\n    // Ton code ici\n\n    return 0;\n}\n';
}
function planFiles(tp, plan, mode, lang) {
  const ext = lang === 'cpp' ? 'cpp' : 'c';
  const ver = lang === 'cpp' && plan.language !== 'cpp' ? ' (version C++)' : '';
  const names = tp.kids.map(k => k.name);
  const exs = (plan.exercises || []).filter(e => e.code !== false);
  if (mode === 'aucun') return [];
  if (mode === 'par_tp') {
    const name = slugWords(tp.name, 2) + '.' + ext;
    let head = '/*\n * ' + tp.name + ' - ' + (plan.title || 'Exercices') + ver + '\n *\n';
    for (const e of exs) head += ' * Exercice ' + e.num + ' : ' + e.title + '\n' + commentLines(e.statement) + '\n *\n';
    return [{ name, label: 'Tous les exercices (' + exs.length + ')', content: head + ' */\n\n' + starterBody(lang), exists: names.includes(name) }];
  }
  return exs.map(e => {
    const num = String(e.num || '').replace(/[^\d.]/g, '').split('.').filter(Boolean).join('_') || 'x';
    const name = 'ex' + num + '_' + slugWords(e.title, 3) + '.' + ext;
    const prefix = 'ex' + num + '_';
    const exists = names.some(n => n === name || (n.startsWith(prefix) && isCode({ name: n })));
    const content = '/*\n * ' + tp.name + ' - Exercice ' + e.num + ' : ' + e.title + ver + '\n *\n' + commentLines(e.statement) + '\n */\n\n' + starterBody(lang);

/* fichiers de données du dossier, puis des dossiers parents jusqu'à la matière (le plus proche l'emporte) */
async function sqlSources(f) {
  const out = []; const stop = matiereOf(f);
  // le TD de ce dossier (TD3…) : on ignore les tables marquées pour un autre TD (« TD2 - contenu des tables.txt »)
  const sj = f.kids.find(isSujet);
  const unitTag = sujetTag({ name: f.name }) || (sj && sujetTag(sj));
  for (let x = f; x; x = x.parent ? nodes.get(x.parent) : null) {
    const kids = x.kids.slice().sort((a, b) => (sujetTag(b) === unitTag) - (sujetTag(a) === unitTag));
    for (const k of kids) {
      if (isFolder(k) || SITE_DOC.test(k.name)) continue;
      const kt = sujetTag(k); if (kt && unitTag && kt !== unitTag) continue;
      if (ext(k) === 'sql' || ['txt', 'md', 'csv'].includes(ext(k))) { const t = await fileText(k); if (t && (ext(k) === 'sql' || /^\s*\+-{2,}/m.test(t))) out.push({ name: k.name, text: t }); }
    }
    if (x === stop) break;
  }
  return out;
}
async function sqlEnvFor(f) {
  const lib = await loadAlasql();
  const base = SQLKIT.collect(await sqlSources(f));
  const probe = SQLKIT.build(lib, base);
  return { lib, base, info: probe.info, errors: probe.errors, run: sql => SQLKIT.run(lib, base, sql) };
}
function sqlTablesText(env, max) {
  let s = '', left = max || 9000;
  for (const t of env.info) {
    const r = env.run('SELECT * FROM `' + t.name + '`').results[0];
    const a = '-- table ' + t.name + ' (' + t.cols.join(', ') + ')\n' + (r && r.cols ? SQLKIT.ascii(r) : '') + '\n';
    if (a.length > left) { s += '-- table ' + t.name + ' (' + t.cols.join(', ') + ') : ' + t.count + ' lignes (contenu coupé)\n'; continue; }
    s += a; left -= a.length;
  }
  return s;
}

/* ================= recherche rapide (Ctrl+K) ================= */
const fold = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function searchIndex() {
  const items = [];
  for (const n of nodes.values()) {
    if (n.id === ROOT) continue;
    const where = pathOf(n).slice(1, -1).map(x => x.name).join(' / ');
    if (isFolder(n) && isSaeProject(n)) { items.push({ kind: 'SAE', title: n.name, sub: pathOf(n).slice(1, -1).map(x => x.name).join(' / '), hash: 's-' + n.id, color: matColor(n) }); continue; }
    if (isFolder(n)) { items.push({ kind: isTdUnit(n) ? 'TD' : isRefFolder(n) ? 'Cours' : 'Dossier', title: n.name, sub: where, hash: (isTdUnit(n) ? 't-' : 'd-') + n.id, color: matColor(n) }); continue; }
    if (isSiteFile(n)) continue;
    const isEx = isRunnable(n) && n.content != null;
    items.push({ kind: isEx ? 'Exercice' : ext(n) === 'pdf' ? 'PDF' : 'Fichier', title: isEx ? describe(n).title : n.name.replace(/\.[^.]+$/, ''), sub: where + (isEx ? ' · ' + n.name : ''), hash: 'f-' + n.id, text: n.content || n.preview || '', color: matColor(n) });
  }
  for (const u of nodes.values()) if (isFolder(u) && isTdUnit(u)) {
    const plan = store.get(planKeyOf(u), null); if (!plan) continue;
    plan.exercises.forEach((e, i) => items.push({ kind: 'Question', title: (e.num ? e.num + '. ' : '') + e.title, sub: pathOf(u).slice(1).map(x => x.name).join(' / '), hash: 't-' + u.id + '~' + i, text: e.statement, color: matColor(u) }));
  }

}
function openSearch() {
  if ($('.pal-wrap')) return;
  const items = searchIndex().map(it => Object.assign(it, { ft: fold(it.title), fs: fold(it.sub), fx: fold(it.text) }));
  const input = el('input', { type: 'search', placeholder: 'TP4, td3, jointure, nombres premiers…', 'aria-label': 'Rechercher', autocomplete: 'off' });
  const list = el('ul', { class: 'pal-list', role: 'listbox' });
  const pal = el('div', { class: 'pal', role: 'dialog', 'aria-label': 'Recherche' }, el('div', { class: 'pal-in' }, el('svg', { width: '16', height: '16', viewBox: '0 0 24 24', html: '<circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' }), input, el('kbd', { class: 'k pal-esc', text: 'Échap' }), el('button', { class: 'btn sm pal-close', type: 'button', onclick: () => wrap.remove() }, 'Fermer')), list);
  const wrap = el('div', { class: 'pal-wrap' }, pal);
  document.body.append(wrap);
  let res = [], sel = 0;
  const close = () => { wrap.remove(); };
  wrap.addEventListener('mousedown', ev => { if (ev.target === wrap) close(); });
  function snippet(it, q) {
    const i = it.fx.indexOf(q); if (i < 0) return '';
    const a = Math.max(0, i - 40); return (a ? '…' : '') + it.text.slice(a, i + q.length + 60).replace(/\s+/g, ' ') + '…';
  }
  function render() {
    const q = fold(input.value.trim());
    list.textContent = '';
    if (!q) res = items.filter(it => it.kind === 'TD' || (it.kind === 'Dossier' && /^tp\s*°?\d|^td\d/i.test(it.title))).slice(0, 12);
    else {
      const words = q.split(/\s+/);
      res = items.map(it => {
        let sc = 0;
        for (const wd of words) {
          if (it.ft.startsWith(wd)) sc += 6; else if (it.ft.includes(wd)) sc += 4; else if (it.fs.includes(wd)) sc += 2; else if (it.fx.includes(wd)) sc += 1; else return null;
        }
        return { it, sc: sc + (it.kind === 'Question' || it.kind === 'Exercice' ? 0.5 : 0) };
      }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, 30).map(x => x.it);
    }
    sel = 0;
    if (!res.length) { list.append(el('li', { class: 'pal-empty', text: q ? 'Rien trouvé.' : 'Tape pour chercher.' })); return; }
    res.forEach((it, i) => {
      const w0 = q.split(/\s+/)[0]; const sn = q && !it.ft.includes(w0) && !it.fs.includes(w0) ? snippet(it, w0) : '';
      const li = el('li', { class: 'pal-it' + (i === sel ? ' on' : ''), role: 'option' },
        el('span', { class: 'pal-k', style: it.color ? '--mat:' + it.color : '', text: it.kind }),
        el('span', { class: 'pal-t' }, el('b', { text: it.title }), el('span', { text: it.sub }), sn ? el('em', { text: sn }) : null));
      li.addEventListener('mousemove', () => { if (sel !== i) { sel = i; paint(); } });
      li.addEventListener('click', () => { close(); go(it.hash); });
      list.append(li);
    });
  }
  function paint() { [...list.children].forEach((li, i) => li.classList.toggle('on', i === sel)); const on = list.children[sel]; if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' }); }
  input.addEventListener('input', render);
  input.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); sel = Math.min(res.length - 1, sel + 1); paint(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); sel = Math.max(0, sel - 1); paint(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); const it = res[sel]; if (it) { close(); go(it.hash); } }

  render(); input.focus();
}
document.addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K')) { ev.preventDefault(); openSearch(); } });

/* ================= revoir mes erreurs (répétition espacée) ================= */
const DAY = 86400000;
const SPACING = [1, 3, 7];
function mistakesAll() { return store.get('mistakes', []); }
function dueMistakes() { const now = Date.now(); return mistakesAll().filter(m => m.due <= now); }
function saveMistakes(list) { store.set('mistakes', list.slice(-200)); updateErrLink(); }
function addMistake(m) {
  const list = mistakesAll().filter(x => x.id !== m.id);
  list.push(Object.assign({ step: 0, at: Date.now(), due: Date.now() + SPACING[0] * DAY }, m));
  saveMistakes(list);
}
function dropMistake(id) { saveMistakes(mistakesAll().filter(x => x.id !== id)); }

  if (ok) { m.step++; if (m.step >= SPACING.length) { saveMistakes(list.filter(x => x !== m)); return 'acquis'; } m.due = Date.now() + SPACING[m.step] * DAY; }

  saveMistakes(list); return m.step;
}

/* Markdown → Google Doc dans un dossier (les arbres deviennent des images) ; remplace le document du même nom */
async function saveMdAsDoc(folder, title, mdText) {

  const tmp = document.createElement('div'); tmp.innerHTML = md(mdText, { plain: true });
  for (const fig of [...tmp.querySelectorAll('figure.alg-tree')]) {
    const src = fig.querySelector('.alg-src'); const cap = fig.querySelector('figcaption');
    try { const im = await algPng(src.textContent); const max = 600, sc = Math.min(1, max / im.w); fig.outerHTML = (cap ? '<p><b>' + escH(cap.textContent) + '</b></p>' : '') + '<p><img src="' + im.url + '" width="' + Math.round(im.w * sc) + '" height="' + Math.round(im.h * sc) + '"></p><p><code>' + escH(src.textContent) + '</code></p>'; }
    catch (e) { fig.outerHTML = '<pre>' + escH(src ? src.textContent : '') + '</pre>'; }
  }
  const body = tmp.innerHTML.replace(/<pre>/g, '<pre style="font-family:\'Courier New\',monospace;font-size:10pt;background:#f4f4f4;padding:6px">').replace(/<code>/g, '<code style="font-family:\'Courier New\',monospace">');
  const html = '<html><head><meta charset="utf-8"></head><body>' + body + '</body></html>';

  const p = r.payload || {};
  const old = (nodes.get(folder.id) || folder).kids.find(k => k.name === title && k.id !== p.id);
  if (old && p.id) { try { await mcp.callTool(DRIVE, 'trash_file', { fileId: old.id }); data.nodes = data.nodes.filter(x => x.id !== old.id); } catch (e) {} }

}

function algBlock(code) {
  const lines = String(code).split('\n').map(l => l.trim());
  const fig = (expr, t, label) => '<figure class="alg-tree">' + (label ? '<figcaption>' + escH(label) + '</figcaption>' : '') + algSvg(t, { fill: 'var(--panel)' }) + '<code class="alg-src">' + escH(expr) + '</code></figure>';
  const clean = l => l.replace(/^\s*(?:\d+[.)]|[a-z]\)|[-*])\s*/, '');
  let out = '', label = '', i = 0;
  const tryAt = j => { let acc = ''; for (let n = j; n < Math.min(lines.length, j + 8); n++) { if (!lines[n]) break; acc += (acc ? ' ' : '') + clean(lines[n]); try { return { t: parseAlg(acc), expr: acc, next: n + 1 }; } catch (e) { } } return null; };
  while (i < lines.length) {
    if (!lines[i]) { i++; continue; }
    const r = tryAt(i);
    if (r) { out += fig(r.expr, r.t, label); label = ''; i = r.next; continue; }
    if (tryAt(i + 1)) { label = lines[i].replace(/[:：]\s*$/, ''); i++; continue; }
    out += '<pre><code>' + escH(lines[i]) + '</code></pre>'; i++;
  }
  return out;
}
/* image PNG d'un arbre (pour le Google Doc de la fiche) */
async function algPng(expr) {
  const svg = algSvg(parseAlg(expr), { line: '#111', text: '#111', fill: '#fff' });
  const m = /width="(\d+)" height="(\d+)"/.exec(svg); const w = +m[1], h = +m[2], k = 2;
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
  const c = document.createElement('canvas'); c.width = w * k; c.height = h * k; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);

}

function md(src, opts) {
  opts = opts || {};
  const out = [];
  const parts = src.split(/```([a-zA-Zé+]*)[ \t]*\n?([\s\S]*?)(?:```|$)/g);
  for (let i = 0; i < parts.length; i++) {
    if (i % 3 === 1) continue;
    if (i % 3 === 2) { const lang = (parts[i - 1] || '').toLowerCase(); out.push(lang === 'arbre' || lang === 'algebre' ? algBlock(parts[i]) : '<pre><code>' + highlight(parts[i].replace(/\n$/, '')) + '</code></pre>'); continue; }
    const txt = parts[i];
    const lines = txt.split('\n');
    let list = null, para = [];
    const inline = s => escH(s)
      .replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
      .replace(/\b(lignes?|l\.)\s*(\d+)(?:\s*(?:à|-|et)\s*(\d+))?/gi, (m, w, a, b) => opts.plain ? m : '<button class="lnref" type="button" data-l="' + a + '">' + m + '</button>');
    const flushP = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push('<' + list.t + '>' + list.items.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + list.t + '>'); list = null; } };
    let table = null;
    const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    const flushT = () => { if (table) { const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)); const head = table.length > 1 && /^\s*\|?\s*:?-{2,}/.test(table[1]);
      out.push('<div class="md-table"><table>' + rows.map((r, i) => '<tr>' + cells(r).map(c => (head && i === 0 ? '<th>' : '<td>') + inline(c) + (head && i === 0 ? '</th>' : '</td>')).join('') + '</tr>').join('') + '</table></div>'); table = null; } };
    for (const l of lines) {
      if (/^\s*\|.*\|\s*$/.test(l)) { flushP(); flushL(); (table = table || []).push(l); continue; }
      flushT();
      const ul = /^\s*[-*•]\s+(.*)$/.exec(l), ol = /^\s*\d+[.)]\s+(.*)$/.exec(l), h = /^\s*#{1,4}\s+(.*)$/.exec(l);
      if (ul || ol) { flushP(); const t = ul ? 'ul' : 'ol'; if (!list || list.t !== t) { flushL(); list = { t, items: [] }; } list.items.push((ul || ol)[1]); }
      else if (h) { flushP(); flushL(); const lv = Math.min(4, (/^\s*(#+)/.exec(l)[1].length) + 1); out.push('<h' + lv + '>' + inline(h[1]) + '</h' + lv + '>'); }
      else if (!l.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(l); }
    }
    flushP(); flushL(); flushT();
  }
  return out.join('');
}

/* ================= exécution dans un Worker ================= */
function workerSource(body, debug, bps) {
  return CppRuntime.toString() + '\n' + CppDebugger.toString() + '\n' +
    'let __pending=null,__w0=0,__wait=0;\n' +
    'const __io={write:(s,e)=>postMessage({t:"out",s,e}),readLine:()=>new Promise(r=>{__pending=r;__w0=performance.now();postMessage({t:"need"});}),clear:()=>postMessage({t:"clear"})};\n' +
    'const __env=CppRuntime(__io);\n' +
    (debug ? 'const $B=CppDebugger(__env,m=>{__w0=performance.now();postMessage(m);},' + JSON.stringify(bps || []) + ');\n' : 'const $B=null;\n') +
    'onmessage=m=>{const d=m.data;if(d.t==="line"&&__pending){__wait+=performance.now()-__w0;const p=__pending;__pending=null;p(d.s);}else if((d.t==="dbg"||d.t==="bps")&&$B){if(d.t==="dbg")__wait+=performance.now()-__w0;$B.msg(d);}};\n' +
    '(async()=>{const t0=performance.now();let code=0,err=null;\ntry{code=await (async function($rt,$o,$e,$i){\n' + body +
    '\n})(__env.$rt,__env.$o,__env.$e,__env.$i);}catch(x){if(x&&x.cppExit!==undefined)code=x.cppExit;else{let msg=x&&x.message||String(x);if(x instanceof RangeError&&/call stack/i.test(msg))msg="Dépassement de pile : trop d\'appels imbriqués (récursion infinie ?)";else if(!(x&&x.cppRuntime))msg="Erreur interne : "+msg;err={msg,line:x&&x.cppLine};}}\n' +
    'try{__env.$rt.flush();}catch(_){}postMessage({t:"done",code:code|0,err,ms:performance.now()-t0-__wait});})();\n';
}

function startProgram(body, h, opts) {
  opts = opts || {};
  const r = { alive: true, send: () => {}, kill: () => {}, dbg: () => {}, bps: () => {} };
  let worker = null;
  try {
    const url = URL.createObjectURL(new Blob([workerSource(body, opts.debug, opts.bps)], { type: 'text/javascript' }));
    worker = new Worker(url);
    URL.revokeObjectURL(url);
  } catch (e) { worker = null; }
  if (worker) {
    worker.onmessage = (m) => {
      const d = m.data; if (!r.alive) return;
      if (d.t === 'out') h.out(d.s, d.e);
      else if (d.t === 'need') h.need();
      else if (d.t === 'pause') h.pause && h.pause(d);
      else if (d.t === 'clear') h.clear();
      else if (d.t === 'done') { r.alive = false; worker.terminate(); if (runner === r) runner = null; h.done(d); }
    };
    worker.onerror = (e) => { if (!r.alive) return; e.preventDefault(); r.alive = false; worker.terminate(); if (runner === r) runner = null; h.done({ err: { msg: 'Erreur interne : ' + (e.message || 'exécution impossible') } }); };
    r.send = (line) => worker.postMessage({ t: 'line', s: line });
    r.dbg = (cmd, bps) => worker.postMessage({ t: 'dbg', cmd, bps });
    r.bps = (bps) => worker.postMessage({ t: 'bps', bps });
    r.kill = (silent) => { if (!r.alive) return; r.alive = false; worker.terminate(); if (runner === r) runner = null; if (!silent) h.done({ killed: true }); };
    return r;
  }
  // Repli : exécution dans la page
  let pending = null, killed = false;
  const env = CppRuntime({ write: (s, e) => { if (!killed) h.out(s, e); }, readLine: () => new Promise(res => { pending = res; setTimeout(() => h.need(), 0); }), clear: () => h.clear() });
  const B = opts.debug ? CppDebugger(env, m => setTimeout(() => !killed && h.pause && h.pause(m), 0), opts.bps || []) : null;
  r.send = (line) => { if (pending) { const p = pending; pending = null; p(line); } };
  r.dbg = (cmd, bps) => B && B.msg({ t: 'dbg', cmd, bps });
  r.bps = (bps) => B && B.msg({ t: 'bps', bps });

function runHeadless(body, inputLines, o) {

    let out = '', starved = false, done = false, r = null;
    const q = (inputLines || []).slice();
    const finish = (d) => { if (done) return; done = true; clearTimeout(t); resolve(Object.assign({ out, starved }, d)); };
    r = startProgram(body, {
      out: (s) => { out += s; if (out.length > 200000) { r.kill(true); finish({ err: { msg: 'Sortie trop longue (boucle infinie ?)' } }); } },
      clear: () => {},
      need: () => { if (q.length) { const l = q.shift(); if (o.echo !== false) out += l + '\n'; r.send(l); } else { starved = true; r.send(null); } },

let syncing = false;
async function sync(manual) {
  if (FRIEND && !ROOT) return;
  if (syncing) return; syncing = true; let syncedOk = false;
  const btn = $('#syncBtn'); btn.disabled = true;
  setSync('busy', 'Lecture du dossier BUT 1…');
  const mcp = await getMcp();
  if (!mcp) {
    syncing = false; btn.disabled = false;
    setSync('local', syncInfo() + '<br>La synchronisation en direct n\'est possible que depuis claude.ai.');
    if (manual) toast('Synchronisation indisponible dans cette vue');
    return;
  }
  const call = async (tool, input) => {
    try { return (await mcp.callTool(DRIVE, tool, input, { cache: false })).payload; }
    catch (e) {
      if (e && e.retryable) { await new Promise(r => setTimeout(r, (e.retryAfterMs || 800) + Math.random() * 400)); return (await mcp.callTool(DRIVE, tool, input, { cache: false })).payload; }
      throw e;
    }
  };
  try {
    const old = new Map(data.nodes.map(n => [n.id, n]));
    const out = [];
    const rootMeta = old.get(ROOT) || { id: ROOT, name: 'BUT 1', mime: 'application/vnd.google-apps.folder', parent: null };
    out.push(Object.assign({}, rootMeta, { parent: null }));
    // lecture niveau par niveau : un appel couvre plusieurs dossiers (« parentId = a or parentId = b … »)
    const known = new Set([ROOT]); let level = [ROOT], seen = 0;
    const listChildren = async (ids) => {
      const res = []; let token = null;
      for (let page = 0; page < 30; page++) {
        const input = { query: ids.map(id => "parentId = '" + id + "'").join(' or '), excludeContentSnippets: true, pageSize: 100 };
        if (token) input.pageToken = token;
        const p = await call('search_files', input) || {};
        const files = p.files || [];
        res.push(...files);
        if (!files.length || !p.nextPageToken) break;
        token = p.nextPageToken;
      }
      return res;
    };
    while (level.length && seen < 1500) {
      const chunks = []; for (let i = 0; i < level.length; i += 12) chunks.push(level.slice(i, i + 12));
      const next = [];
      for (let i = 0; i < chunks.length; i += 3) {
        const parts = await Promise.all(chunks.slice(i, i + 3).map(c => listChildren(c).then(fs => ({ c, fs }))));
        for (const { c, fs } of parts) for (const f of fs) {
          if (known.has(f.id)) continue;
          const parent = f.parentId && c.includes(f.parentId) ? f.parentId : (c.length === 1 ? c[0] : null);
          if (!parent) continue;
          known.add(f.id); seen++;
          const n = { id: f.id, name: f.title || f.name || '(sans nom)', mime: f.mimeType, parent, modified: f.modifiedTime, url: f.viewUrl, size: f.fileSize ? +f.fileSize : undefined };
          const o = old.get(f.id);
          if (o && o.content != null && o.modified === n.modified) n.content = o.content;
          if (o && o.preview && o.modified === n.modified) n.preview = o.preview;
          out.push(n);
          if (n.mime === 'application/vnd.google-apps.folder') next.push(f.id);
        }
        setSync('busy', 'Lecture du dossier… ' + seen + ' éléments');
      }
      level = next;
    }
    // contenu des fichiers texte nouveaux ou modifiés
    const todo = out.filter(n => n.content == null && TEXT_EXT.includes(((/\.([A-Za-z0-9+]+)$/.exec(n.name) || [, ''])[1] || '').toLowerCase()) && !(n.size > 400000));
    let k = 0, qi = 0;
    const worker = async () => {
      while (qi < todo.length) {
        const n = todo[qi++];
        try { const p = await call('download_file_content', { fileId: n.id }); if (p && typeof p.content === 'string') n.content = b64utf8(p.content); }
        catch (e) { if (['needs_reauth', 'server_not_connected', 'not_in_manifest', 'consent_required'].includes(e && e.code)) throw e; }
        setSync('busy', 'Téléchargement ' + (++k) + '/' + todo.length);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    const before = data.nodes.length;
    data = { root: ROOT, syncedAt: new Date().toISOString(), nodes: out };
    store.set('snapshot', data);
    index(); renderTree(); updateEvalCount();
    if (current && (current.kind === 'home' || current.kind === 'edt' || current.kind === 'evals')) route();
    // rafraîchir la vue courante si c'est un dossier
    if (current && current.kind === 'folder') { const n = nodes.get(current.id); if (n) showFolder(n); }
    setSync('ok', syncInfo()); syncedOk = true;
    if (manual) toast('Drive synchronisé · ' + (out.length - before >= 0 ? (out.length - before) + ' nouveau(x) élément(s)' : 'mis à jour'));
  } catch (e) {
    setSync('err', escH(errText(e)) + '<br>' + syncInfo());
  }
  syncing = false; btn.disabled = false;
  if (syncedOk) afterSync();
}

async function driveCall(tool, input) {
  const mcp = await getMcp(); if (!mcp) throw new Error('Google Drive n\'est accessible que depuis claude.ai');
  try { return (await mcp.callTool(DRIVE, tool, input, { cache: false })).payload; }
  catch (e) {
    if (e && e.retryable) { await new Promise(r => setTimeout(r, (e.retryAfterMs || 800) + Math.random() * 400)); return (await mcp.callTool(DRIVE, tool, input, { cache: false })).payload; }
    throw e;
  }
}
async function listTree(rootId) {
  const out = []; const known = new Set([rootId]); let level = [rootId];
  while (level.length && out.length < 1500) {
    const next = [];
    for (let i = 0; i < level.length; i += 12) {
      const c = level.slice(i, i + 12); let token = null;
      for (let page = 0; page < 30; page++) {
        const input = { query: c.map(id => "parentId = '" + id + "'").join(' or '), excludeContentSnippets: true, pageSize: 100 };
        if (token) input.pageToken = token;
        const p = await driveCall('search_files', input) || {};
        const files = p.files || [];
        for (const f of files) {
          if (known.has(f.id)) continue;
          const parent = f.parentId && c.includes(f.parentId) ? f.parentId : (c.length === 1 ? c[0] : null);
          if (!parent) continue;
          known.add(f.id);
          out.push({ id: f.id, name: f.title || f.name || '', mime: f.mimeType, parent });
          if (f.mimeType === FOLDER) next.push(f.id);
        }
        if (!files.length || !p.nextPageToken) break;
        token = p.nextPageToken;
      }
    }
    level = next;
  }
  return out;
}
/* copie dans dstRoot ce qui manque (même nom, même dossier) ; ne modifie ni ne supprime jamais rien */
async function mirrorTree(src, srcRoot, dstRoot, keep, progress) {
  const kids = new Map(); for (const n of src) { if (!kids.has(n.parent)) kids.set(n.parent, []); kids.get(n.parent).push(n); }
  const useful = new Map();
  const has = id => { if (!useful.has(id)) useful.set(id, (kids.get(id) || []).some(k => k.mime === FOLDER ? has(k.id) : keep(k))); return useful.get(id); };
  if (!has(srcRoot)) return 0;
  const dst = await listTree(dstRoot);
  const dk = new Map(); const addD = n => { if (!dk.has(n.parent)) dk.set(n.parent, []); dk.get(n.parent).push(n); };
  dst.forEach(addD);
  const norm = s => (s || '').trim().toLowerCase();
  const find = (pid, name, folder) => (dk.get(pid) || []).find(x => norm(x.name) === norm(name) && (x.mime === FOLDER) === folder);
  let copied = 0;
  const walk = async (sid, did) => {
    for (const k of kids.get(sid) || []) {
      if (k.mime === FOLDER) {
        if (!has(k.id)) continue;
        let d = find(did, k.name, true);
        if (!d) {
          const p = await driveCall('create_file', { title: k.name, parentId: did, contentMimeType: FOLDER }) || {};
          if (!p.id) throw new Error('impossible de créer le dossier ' + k.name);
          d = { id: p.id, name: k.name, mime: FOLDER, parent: did }; addD(d);
        }
        await walk(k.id, d.id);
      } else if (keep(k) && !find(did, k.name, false)) {
        const p = await driveCall('copy_file', { fileId: k.id, parentId: did, title: k.name }) || {};
        addD({ id: p.id, name: k.name, mime: k.mime, parent: did });
        copied++; if (progress) progress(copied, k.name);
      }
    }
  };
  await walk(srcRoot, dstRoot);
  return copied;
}

function updateEvalCount() { try { const n = upcomingEvalCount(14); $('#evalCount').textContent = n ? String(n) : ''; } catch (e) {} }
window.addEventListener('hashchange', updateEvalCount);
if (FRIEND) $('#edtLink').hidden = true;
$('#newDraft').addEventListener('click', newDraft);
$('#guideLink').addEventListener('click', () => go('guide'));
$('#syncBtn').addEventListener('click', () => sync(true));
$('#autoSave').checked = autosaveOn();
$('#autoSave').addEventListener('change', () => { store.set('autosave', $('#autoSave').checked); toast($('#autoSave').checked ? 'Sauvegarde automatique sur Drive activée' : 'Sauvegarde automatique désactivée : pense à « Enregistrer dans Drive »'); });
/* option « enregistrer en quittant » : dans le guide (Réglages) */
$('#menuBtn').addEventListener('click', () => $('#app').classList.add('drawer'));
$('#scrim').addEventListener('click', closeDrawer);
function closeDrawer() { $('#app').classList.remove('drawer'); }
$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', r.dataset.theme);
});
{ const t = store.get('theme', null); if (t) document.documentElement.dataset.theme = t; }
// mémoriser le dernier dossier pour les brouillons
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#d-')) store.set('lastFolder', location.hash.slice(3)); });
setSync('local', syncInfo());
route(); updateEvalCount();

// synchronisation automatique si l'accès Drive est déjà accordé
(async () => {
  const mcp = await getMcp();
  if (!mcp) { setSync('local', syncInfo() + ' — La synchronisation en direct n\'est possible que depuis claude.ai.'); $('#syncBtn').disabled = true; return; }
  let st = 'prompt';
  try { const perms = await window.claude.use('permissions'); if (perms) st = await perms.state('mcp:' + DRIVE).catch(() => 'prompt'); } catch (e) {}
  if (FRIEND && !ROOT) { setSync('local', 'Pas encore installé'); return; }
  if (st === 'granted') sync(false);
  else setSync('local', syncInfo() + '<br>Clique ci-dessous pour récupérer les nouveaux fichiers.');
})();
})();
</script>
